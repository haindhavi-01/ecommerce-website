<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ShopEase - E-Commerce Website</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header>
        <div class="logo">ShopEase</div>

        <nav>
            <a href="#home">Home</a>
            <a href="#products">Products</a>
            <a href="#contact">Contact</a>
        </nav>

        <button class="cart-btn" onclick="openCart()">
            🛒 Cart (<span id="cart-count">0</span>)
        </button>
    </header>


    <!-- Hero Section -->
    <section class="hero" id="home">

        <div class="hero-content">
            <h1>Welcome to ShopEase</h1>

            <p>
                Discover quality products at affordable prices.
            </p>

            <a href="#products" class="shop-btn">
                Shop Now
            </a>
        </div>

    </section>


    <!-- Products Section -->
    <section class="products-section" id="products">

        <h2>Our Products</h2>

        <!-- Search -->
        <div class="search-container">

            <input
                type="text"
                id="search-input"
                placeholder="Search products..."
                onkeyup="searchProducts()"
            >

        </div>


        <!-- Categories -->
        <div class="categories">

            <button onclick="filterProducts('All')">
                All
            </button>

            <button onclick="filterProducts('Electronics')">
                Electronics
            </button>

            <button onclick="filterProducts('Fashion')">
                Fashion
            </button>

            <button onclick="filterProducts('Home')">
                Home
            </button>

        </div>


        <!-- Product Container -->
        <div id="product-container" class="product-container">

        </div>

    </section>


    <!-- Cart Modal -->
    <div id="cart-modal" class="modal">

        <div class="cart-box">

            <span class="close" onclick="closeCart()">
                &times;
            </span>

            <h2>Shopping Cart</h2>

            <div id="cart-items">

            </div>

            <div class="cart-total">

                <h3>
                    Total:
                    ₹<span id="cart-total">0</span>
                </h3>

                <button onclick="openCheckout()" class="checkout-btn">
                    Checkout
                </button>

            </div>

        </div>

    </div>


    <!-- Checkout Modal -->
    <div id="checkout-modal" class="modal">

        <div class="checkout-box">

            <span class="close" onclick="closeCheckout()">
                &times;
            </span>

            <h2>Checkout</h2>

            <form id="checkout-form" onsubmit="placeOrder(event)">

                <label>Full Name</label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your name"
                >

                <label>Email</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                >

                <label>Phone Number</label>

                <input
                    type="tel"
                    id="phone"
                    placeholder="Enter phone number"
                >

                <label>Address</label>

                <textarea
                    id="address"
                    placeholder="Enter your address"
                ></textarea>

                <button type="submit">
                    Place Order
                </button>

            </form>

        </div>

    </div>


    <!-- Footer -->
    <footer id="contact">

        <h3>ShopEase</h3>

        <p>
            Your one-stop online shopping destination.
        </p>

        <p>
            © 2026 ShopEase. All Rights Reserved.
        </p>

    </footer>


    <script src="script.js"></script>

</body>
</html>
